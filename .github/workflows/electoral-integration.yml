name: Octalve Vote Electoral Integration
on:
  pull_request:
    branches: [main, phase/02-electoral-auth-dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electoral-browser-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vote_ci
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: vote_integration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vote_ci -d vote_integration_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vote_ci:ephemeral_ci_password@127.0.0.1:5432/vote_integration_ci?schema=public
      AUTH_THROTTLE_SECRET: ci-integration-secret-not-for-deployment-2026
      ENABLE_STAFF_LOGIN: 'true'
      ENABLE_ELECTORAL_SIGNUP: 'true'
      CI_ELECTORAL_INTEGRATION: 'true'
      ENABLE_DRAFT_ELECTIONS: 'true'
      DRAFT_ELECTION_CAPACITY: '3'
      CI_APPROVED_ELECTORAL_EMAIL: octalve-approved-fixture@example.test
      CI_APPROVED_ELECTORAL_PASSWORD: CI-Approved-Demo-2026-NonProd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact app dependencies
        run: npm install --no-audit --no-fund
      - name: Apply reviewed initial migration to disposable database
        run: npm run db:deploy
      - name: Prepare pre-recording approved synthetic organization fixture
        run: node --experimental-strip-types scripts/seed-ci-fixtures.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build for test environment
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser-only electoral registration and authorization journey
        run: npx playwright test tests/e2e/electoral-authority.spec.ts
      - name: Upload continuous recording and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-3-electoral-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
